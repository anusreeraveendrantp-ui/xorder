<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Summary Component</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="main">
      <div class="container">
        <!-- Hero / Image Section -->
        <div class="hero-image"></div>

        <!-- Order Summary Section -->
        <div class="card-body">
          <!-- Heading -->
          <h1 class="heading">Order Summary</h1>

          <!-- Summary Paragraph -->
          <p class="summary-para">
            You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!
          </p>

          <!-- Plan Details -->
          <div class="plan-details">
            <div class="plan-icon">
              <img src="images/icon-music.svg" alt="Music icon" />
            </div>
           <div class="plan-text">
  <h3 class="plan-name">Annual Plan</h3>
  <p class="plan-price">$59.99/year</p>
</div>
            <div class="change-link">
              <a href="#">Change</a>
            </div>
          </div>

          <!-- Proceed to Payment Button -->
          <button class="proceed-btn">Proceed to Payment</button>

          <!-- Cancel Order -->
          <button class="cancel-order">Cancel Order</button>
        </div>
      </div>
    </div>

    <!-- Footer / Attribution -->
    <footer class="attribution">
      Challenge by
      <a href="https://www.crio.do" target="_blank" rel="noopener noreferrer"
        >Crio</a
      >. Coded on
      <a
        href="https://github.com"
        target="_blank"
        rel="noopener noreferrer"
        >GitHub</a
      >.
    </footer>
  </body>
</html>
